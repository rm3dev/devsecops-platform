# =============================================================================
# Traefik v3 static configuration (Phase 2)
# TLS terminates here ONLY; every backend speaks plain HTTP on internal
# networks (architecture.md §4.3). Certificates: internal CA generated by
# scripts/bootstrap.sh into reverse-proxy/certificates (TLS_MODE=internal-ca).
# =============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  filePath: ""            # stdout — collected by Alloy → Loki

accessLog:
  filters:
    statusCodes: ["400-599"]   # log only errors by default; full log in prod if required
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    # Default TLS options come from the file provider (dynamic/dynamic.yml)
  traefik:
    address: ":8082"      # internal only: ping, prometheus metrics, dashboard

api:
  dashboard: true
  insecure: true          # bound to :8082 which is NEVER host-published in prod

ping:
  entryPoint: traefik

metrics:
  prometheus:
    entryPoint: traefik
    addEntryPointsLabels: true
    addServicesLabels: true

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
  # Docker provider is intentionally NOT used: routing is declared explicitly
  # in dynamic/dynamic.yml (generated from dynamic.yml.tmpl by bootstrap.sh)
  # so the proxy config is auditable in Git.

# --- Let's Encrypt (TLS_MODE=letsencrypt, public DNS required) --------------
# When enabled, uncomment and add per-router `tls.certResolver: letsencrypt`
# in dynamic.yml.tmpl. TLS-ALPN-01 works with the web→websecure redirect above.
# certificatesResolvers:
#   letsencrypt:
#     acme:
#       email: acme@example.com
#       storage: /certs/acme.json
#       tlsChallenge: {}
