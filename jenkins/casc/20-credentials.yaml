# =============================================================================
# JCasC — system credentials (Phase 3 scaffolding, values provisioned by later
# phases). Every secret value comes from environment (secrets/jenkins.env or
# exported by phase scripts) with an explicit placeholder default so the
# controller boots before the target system exists. Placeholders are
# FAIL-CLOSED: any pipeline stage using a "SET_IN_PHASE_*" credential fails
# with a clear message instead of silently doing nothing.
#
# Phase 4: gitlab-jenkins-user + gitlab-api-token  (real PAT)
# Phase 5: sonarqube-admin-token, sonarqube-webhook-token, nexus-deploy
# Phase 7: cosign-signing-key + password (from secrets/cosign.env — keypair via
#          security/scripts/10-cosign-keys.sh; Vault-managed from Phase 11, D-25)
# Phase 8: gitops-commit-token (PAT 'gitops-write' via gitlab/scripts/50-gitops-
#          repository.sh), argocd-auth-token (jenkins-cd API key via kubernetes/
#          argocd/install-argocd.sh → secrets/argocd.env), k8s-verify-kubeconfig
#          (read-only SA via kubernetes/scripts/20-verify-kubeconfig.sh →
#          secrets/k8s.env, consumed in Phase 9)
# Phase 10: slack-webhook-url + teams-webhook-url (real values via
#           secrets/jenkins-notifications.env ← monitoring/scripts/20-configure-
#           notifications.sh; placeholders are fail-closed — dispatch skips)
# Phase 11: vault-approle (dynamic secrets replace most static entries above)
# =============================================================================
credentials:
  system:
    domainCredentials:
      - credentials:
          # GitLab service account for Jenkins (clone, webhooks, commit status)
          - usernamePassword:
              scope: SYSTEM
              id: "gitlab-jenkins-user"
              username: "${GITLAB_JENKINS_USER:-jenkins-ci}"
              password: "${GITLAB_API_TOKEN:-SET_IN_PHASE_4}"
              description: "GitLab PAT for jenkins-ci service user (Phase 4)"

          - string:
              scope: SYSTEM
              id: "gitlab-api-token"
              secret: "${GITLAB_API_TOKEN:-SET_IN_PHASE_4}"
              description: "GitLab API token (same PAT) for REST integrations"

          # Shared secret GitLab sends as X-Gitlab-Token on webhook deliveries
          # (must equal GITLAB_WEBHOOK_TOKEN written by gitlab/scripts; jobs
          # reference it in Phase 6 multibranch/trigger configuration)
          - string:
              scope: SYSTEM
              id: "gitlab-webhook-secret"
              secret: "${GITLAB_WEBHOOK_TOKEN:-SET_IN_PHASE_4}"
              description: "GitLab webhook secret token for delivery verification"

          # GitLab Branch Source server credential (Phase 6): the plugin
          # requires its own gitlabPersonalAccessToken credential type.
          # Same jenkins-ci PAT value — used for project discovery, commit
          # statuses and MR metadata (NOT for hook management, see D-22).
          - gitlabPersonalAccessToken:
              scope: SYSTEM
              id: "gitlab-branch-source-token"
              token: "${GITLAB_API_TOKEN:-SET_IN_PHASE_4}"
              description: "jenkins-ci PAT for GitLab Branch Source (org folder discovery + statuses)"

          # SonarQube analysis + quality-gate webhook
          - string:
              scope: SYSTEM
              id: "sonarqube-admin-token"
              secret: "${SONARQUBE_TOKEN:-SET_IN_PHASE_5}"
              description: "SonarQube server auth token (Phase 5)"
          - string:
              scope: SYSTEM
              id: "sonarqube-webhook-token"
              secret: "${SONAR_WEBHOOK_TOKEN:-SET_IN_PHASE_5}"
              description: "Shared secret verifying SonarQube quality-gate webhooks (Phase 5)"

          # Nexus: artifact publish + docker registry push/pull (same account)
          - usernamePassword:
              scope: SYSTEM
              id: "nexus-deploy"
              username: "${NEXUS_DEPLOY_USER:-jenkins-ci}"
              password: "${NEXUS_DEPLOY_PASSWORD:-SET_IN_PHASE_5}"
              description: "Nexus deploy account — maven/npm/pypi/nuget/raw + docker-hosted (Phase 5)"

          # Container image signing (Phase 7) — key material lives in Vault,
          # exported to the controller env at container start in Phase 11.
          - string:
              scope: SYSTEM
              id: "cosign-signing-key"
              secret: "${COSIGN_KEY:-SET_IN_PHASE_7}"
              description: "Cosign private key PEM (base64) — Vault-managed (Phase 7/11)"
          - string:
              scope: SYSTEM
              id: "cosign-signing-key-password"
              secret: "${COSIGN_PASSWORD:-SET_IN_PHASE_7}"
              description: "Cosign key passphrase — Vault-managed (Phase 7/11)"

          # GitOps repository write access (Phase 8) — short-lived project token
          - string:
              scope: SYSTEM
              id: "gitops-commit-token"
              secret: "${GITOPS_REPO_TOKEN:-SET_IN_PHASE_8}"
              description: "GitLab token for committing digest updates to gitops-repository (Phase 8)"

          # ArgoCD API access for sync/status (Phase 8) — local account with
          # least-privilege RBAC (see argocd/projects in Phase 8)
          - string:
              scope: SYSTEM
              id: "argocd-auth-token"
              secret: "${ARGOCD_AUTH_TOKEN:-SET_IN_PHASE_8}"
              description: "ArgoCD API token for jenkins-cd account (Phase 8)"

          # Read-only Kubernetes verification (Phase 8) — kubeconfig file
          # content injected from Vault; SA permissions: get/list deployments,
          # pods, replicasets, events ONLY.
          - string:
              scope: SYSTEM
              id: "k8s-verify-kubeconfig"
              secret: "${K8S_VERIFY_KUBECONFIG:-SET_IN_PHASE_8}"
              description: "Read-only kubeconfig for deployment verification (Phase 8)"

          # Vault AppRole for Jenkins (Phase 11 wires real values + rotation)
          - usernamePassword:
              scope: SYSTEM
              id: "vault-approle"
              username: "${VAULT_APPROLE_ID:-SET_IN_PHASE_11}"
              password: "${VAULT_APPROLE_SECRET_ID:-SET_IN_PHASE_11}"
              description: "Vault AppRole (role-id/secret-id), 1h TTL, response-wrapped (Phase 11)"

          # Notifications (Phase 10): values come from secrets/jenkins-
          # notifications.env; NotificationService skips 'SET_IN_PHASE*' sends.
          # Phase 11 moves the source of truth into Vault.
          - string:
              scope: SYSTEM
              id: "slack-webhook-url"
              secret: "${SLACK_WEBHOOK_URL:-SET_IN_PHASE_10}"
              description: "Slack incoming webhook (Phase 10)"
          - string:
              scope: SYSTEM
              id: "teams-webhook-url"
              secret: "${TEAMS_WEBHOOK_URL:-SET_IN_PHASE_10}"
              description: "Microsoft Teams workflow webhook (Phase 10)"
