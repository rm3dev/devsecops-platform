# =============================================================================
# JCasC — seed items (Phase 3 folders, Phase 6 team organization folders)
# Job DSL (sandbox disabled for these trusted scripts, see 10-security.yaml).
# Idempotent: re-applied on every controller start / configuration reload.
#
# NOTE: literal block scalars (|) below MUST NOT contain "${...}" sequences —
# JCasC interpolates environment variables inside YAML scalars BEFORE the DSL
# runs; the scripts use string concatenation instead.
# =============================================================================
jobs:
  - script: >
      folder('platform') {
          displayName('Platform Engineering')
          description('Seed jobs, shared-library validation and platform maintenance jobs. Managed as code (jenkins/casc/60-jobs.yaml) — do not edit in the UI.')
      }

      folder('teams') {
          displayName('Application Teams')
          description('One sub-folder per team, containing multibranch pipelines discovered from GitLab groups (wired in Phase 6).')
      }

  # ---------------------------------------------------------------------------
  # Phase 6 (D-22): one GitLab Organization Folder per team group. Each folder
  # auto-discovers every project under teams/<team> in GitLab that contains a
  # Jenkinsfile and creates a multibranch pipeline for it (branches strategy 3
  # = all branches, origin MRs, tags). New repositories need NO Jenkins change:
  #   1. create the project under teams/<team> in GitLab
  #   2. add the standard Jenkinsfile (shared-library examples/Jenkinsfile)
  #   3. platform admin runs gitlab/scripts/add-webhook.sh <path> <job-name>
  #      for instant triggers (the hourly scan below is the safety net)
  # Onboarding a NEW TEAM: create the GitLab group, add its name to TEAMS here,
  # then reload JCasC (Manage Jenkins → Reload Configuration as Code).
  # ---------------------------------------------------------------------------
  - script: |
      def TEAMS = ['payments', 'orders']    // EXAMPLE team slugs — replace with your real teams

      for (String team : TEAMS) {
          String groupPath = 'teams/' + team
          organizationFolder(groupPath) {
              displayName(team + ' (GitLab group)')
              description('Auto-discovered multibranch pipelines for GitLab group ' + groupPath + '. Managed as code (jenkins/casc/60-jobs.yaml) — do not edit in the UI.')

              organizations {
                  // The serverName selects the API/PAT configuration above; the
                  // navigator credentialsId is the optional HTTP checkout credential
                  // for private repositories (GitLab Branch Source docs). Keep these
                  // separate: PATs are not Git username/password credentials. The
                  // teams-group deploy token is read_repository-only.
                  gitLabSCMNavigator {
                      serverName('gitlab')
                      projectOwner(groupPath)
                      credentialsId('gitlab-teams-readonly')
                      traits {
                          gitLabSubGroupProjectDiscovery()   // include subgroups of teams/<team>
                          gitLabBranchDiscovery {
                              strategyId(3)          // 1=default branch, 2=named, 3=all branches
                          }
                          gitLabOriginDiscovery {
                              strategyId(1)          // discover origin MRs (merged with target)
                          }
                          gitLabTagDiscovery()       // v* tags are protected in GitLab (Phase 4)
                      }
                  }
              }

              projectFactories {
                  workflowMultiBranchProjectFactory {
                      scriptPath('Jenkinsfile')
                  }
              }

              orphanedItemStrategy {
                  discardOldItems {
                      daysToKeep(30)
                      numToKeep(-1)
                  }
              }

              triggers {
                  periodicFolderTrigger {
                      interval('1h')                 // safety net for missed webhook events
                  }
              }
          }
      }

  # Manual, trusted validator for shared-library merge requests. The pipeline
  # definition is managed here (not loaded from the MR), uses read-only checkout,
  # checks source text without executing it, and reports status via GitLab external CI.
  - script: |
      pipelineJob('platform/shared-library-mr-validator') {
          displayName('Shared library MR validator')
          description('Trusted, read-only validation of a shared-library MR commit. Does not execute source from the MR. Reports status to GitLab project platform/devsecops-shared-library.')
          parameters {
              stringParam('SOURCE_BRANCH', 'fix-platform-config-constructor', 'MR source branch')
              stringParam('SOURCE_SHA', '', 'Exact 40-character commit SHA from the MR source branch')
          }
          logRotator { daysToKeep(30) }
          definition {
              cps {
                  sandbox(true)
                  script('''
      def sourceBranch = params.SOURCE_BRANCH?.trim()
      def sourceSha = params.SOURCE_SHA?.trim()
      if (!sourceBranch || !(sourceBranch ==~ /[A-Za-z0-9._\/-]+/)) {
          error('SOURCE_BRANCH must contain only letters, digits, dot, underscore, slash, or hyphen')
      }
      if (!sourceSha || !(sourceSha ==~ /[0-9a-f]{40}/)) {
          error('SOURCE_SHA must be a full 40-character lowercase commit SHA')
      }
      node('general') {
          deleteDir()
          stage('Checkout pinned MR commit') {
              checkout([$class: 'GitSCM',
                  branches: [[name: '*/' + sourceBranch]],
                  userRemoteConfigs: [[
                      url: 'http://gitlab/platform/devsecops-shared-library.git',
                      credentialsId: 'gitlab-library-readonly'
                  ]]
              ])
              def actualSha = sh(script: 'git rev-parse HEAD', returnStdout: true).trim()
              if (actualSha != sourceSha) {
                  error('Checked out SHA does not match SOURCE_SHA; refresh the MR parameters and retry')
              }
          }
          gitlabCommitStatus(name: 'shared-library-validation',
              connection: gitLabConnection('gitlab'),
              builds: [[projectId: 'platform/devsecops-shared-library', revisionHash: sourceSha]]) {
              stage('Validate PlatformConfig constructor') {
                  def sourceText = readFile('src/org/company/devsecops/PlatformConfig.groovy')
                  def required = [
                      "PlatformConfig(script, String servicePath = '.')",
                      'this.script = script',
                      'this.servicePath = servicePath',
                      "new PlatformConfig(script, args.servicePath ?: '.')"
                  ]
                  if (!required.every { sourceText.contains(it) }) {
                      error('PlatformConfig explicit constructor checks failed')
                  }
                  if (sourceText.contains("new PlatformConfig(script: script, servicePath: args.servicePath ?: '.')")) {
                      error('Obsolete map-style constructor remains')
                  }
                  echo('PlatformConfig source checks passed; MR source was not executed')
              }
          }
      }
                  ''')
              }
          }
      }

  # ---------------------------------------------------------------------------
  # Phase 8 (D-12/D-26): digest promotion — the ONLY path to qa/uat/prod.
  # The same scanned+signed digest moves environment→environment; artifacts are
  # never rebuilt for promotion. Rollback = same job with an explicit DIGEST.
  # Backed by shared-library step promoteDigest (runs on agent-general).
  # NOTE: no "${...}" below — JCasC interpolates YAML scalars before the DSL runs.
  # ---------------------------------------------------------------------------
  - script: |
      pipelineJob('platform/gitops-promotion') {
          displayName('GitOps digest promotion')
          description('Promote the ALREADY-BUILT (scanned, signed, SBOMed) image digest of a service across environments (dev to qa to uat to prod). Same digest, never rebuilt (D-12/D-26). Rollback: pass an explicit older DIGEST. Kyverno re-verifies the cosign signature at admission in the target cluster.')

          parameters {
              stringParam('SERVICE', '', 'Service slug — the directory under applications/ in platform/gitops-repository (e.g. orders-api)')
              choiceParam('TARGET_ENV', ['qa', 'uat', 'prod', 'dev'], 'Environment receiving the digest')
              stringParam('SOURCE_ENV', '', 'Read the pinned digest from this environment (default: predecessor of TARGET_ENV in dev,qa,uat,prod order)')
              stringParam('DIGEST', '', 'Optional explicit digest sha256:... — overrides SOURCE_ENV (rollback / hotfix promotion)')
          }

          logRotator {
              daysToKeep(90)
          }

          definition {
              cps {
                  sandbox(true)
                  script(
                      "node('general') {\n" +
                      "    stage('Promote digest') {\n" +
                      "        promoteDigest(\n" +
                      "            service: params.SERVICE,\n" +
                      "            targetEnv: params.TARGET_ENV,\n" +
                      "            sourceEnv: params.SOURCE_ENV ?: null,\n" +
                      "            digest: params.DIGEST ?: null)\n" +
                      "    }\n" +
                      "}\n"
                  )
              }
          }
      }
