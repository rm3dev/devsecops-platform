# =============================================================================
# JCasC — security realm + role matrix (Phase 3)
#
# Role model implements master-spec §17. Local realm is the bootstrappable
# baseline; production sites switch securityRealm to LDAP/OIDC in Phase 11 —
# the authorization matrix below keeps working unchanged because it maps
# *principals*; for LDAP, replace `user:` entries with `group:` entries of the
# same names (documented inline).
#
# All passwords come from secrets/jenkins.env (generated by bootstrap.sh,
# mode 0600, gitignored) — never hardcoded here.
# =============================================================================
jenkins:
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          password: "${JENKINS_ADMIN_PASSWORD}"
        - id: "platform-admin"
          password: "${JENKINS_PLATFORM_ADMIN_PASSWORD}"
        - id: "devops-admin"
          password: "${JENKINS_DEVOPS_ADMIN_PASSWORD}"
        - id: "developer"
          password: "${JENKINS_DEVELOPER_PASSWORD}"
        - id: "security-engineer"
          password: "${JENKINS_SECURITY_ENGINEER_PASSWORD}"
        - id: "release-manager"
          password: "${JENKINS_RELEASE_MANAGER_PASSWORD}"
        - id: "app-owner"
          password: "${JENKINS_APP_OWNER_PASSWORD}"

  authorizationStrategy:
    globalMatrix:
      entries:
        # --- Platform Administrator: full control ---------------------------
        - user:
            name: "${JENKINS_ADMIN_USER:-admin}"
            permissions: ["Overall/Administer"]
        - user:
            name: "platform-admin"
            permissions: ["Overall/Administer"]

        # --- DevOps Administrator: pipelines/infra, NOT plugin management ----
        - user:
            name: "devops-admin"
            permissions:
              - "Overall/Read"
              - "Overall/SystemRead"
              - "Overall/Manage"
              - "Job/Read"
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Configure"
              - "Job/Create"
              - "Job/Delete"
              - "Job/Discover"
              - "Job/Workspace"
              - "Job/Move"
              - "View/Read"
              - "View/Configure"
              - "View/Create"
              - "View/Delete"
              # NOTE: there is NO "Computer/Read" permission in Jenkins core —
              # agent visibility is granted by Overall/Read. An unknown string
              # here aborts JCasC at boot (BootFailure, exit 5, restart loop).
              - "Computer/Build"
              - "Computer/Configure"
              - "Computer/Connect"
              - "Computer/Disconnect"
              - "Computer/Delete"
              - "Run/Update"
              - "Run/Delete"
              - "Run/Replay"
              - "Credentials/View"

        # --- Developer: build, test, read reports ----------------------------
        - user:
            name: "developer"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Discover"
              - "Job/Workspace"
              - "View/Read"
              - "Run/Update"
              - "Run/Replay"

        # --- Security Engineer: read everything security-relevant ------------
        - user:
            name: "security-engineer"
            permissions:
              - "Overall/Read"
              - "Overall/SystemRead"
              - "Job/Read"
              - "Job/Discover"
              - "Job/Cancel"
              - "View/Read"
              - "View/Create"
              - "Run/Update"

        # --- Release Manager: approvals/promotions/rollback -------------------
        - user:
            name: "release-manager"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Discover"
              - "View/Read"
              - "Run/Update"
              - "Run/Delete"

        # --- Application Owner: own-application deployments & reports ---------
        - user:
            name: "app-owner"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Discover"
              - "View/Read"
              - "Run/Update"

security:
  # Job DSL scripts come exclusively from the trusted platform repository
  # (see 60-jobs.yaml) — script-security sandbox for DSL disabled so seed jobs
  # do not require manual in-process approvals. Sandboxing remains ON for
  # pipeline scripts from application repositories (default).
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

  # Agent-to-controller access control stays at the platform default (deny
  # dangerous command callables) — do not weaken.
  remotingSecurity:
    enabled: true
