{{- /*
External Secrets Operator (Phase 8): every application secret is a REFERENCE —
Vault KV v2 at secret/data/<vaultAppPath>/<name>, one property per key.
The ClusterSecretStore 'vault-cluster-store' (kubernetes/eso/) authenticates to
Vault with the ESO service account (Vault kubernetes auth — vault/scripts/30-).
*/ -}}
{{- $root := $ -}}
{{- range $secret := .Values.secrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secret.name }}
  labels:
    {{- include "microservice-standard.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $secret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ $root.Values.secretStore.name | default "vault-cluster-store" }}
    kind: {{ $root.Values.secretStore.kind | default "ClusterSecretStore" }}
  target:
    name: {{ $secret.name }}
    creationPolicy: Owner
  data:
    {{- range $key := $secret.keys }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ include "microservice-standard.vaultAppPath" $root }}/{{ $secret.name }}
        property: {{ $key }}
    {{- end }}
---
{{- end }}
