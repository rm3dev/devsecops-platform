# =============================================================================
# Loki 3.x — single-binary (monolithic) mode, filesystem storage (Phase 2)
# Retention enforced by the compactor: ${LOKI_RETENTION_PERIOD} is baked by
# bootstrap.sh? NO — Loki config does not interpolate env vars; the value here
# (336h = 14d) must be kept in sync with .env LOKI_RETENTION_PERIOD manually
# (documented in installation.md §6.4).
# =============================================================================

auth_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_address: 0.0.0.0
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2025-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

# Phase 10 (D-35): embedded ruler — log-derived alerts. Rules are FILE-based
# from monitoring/loki/rules (mounted ro at /loki/rules); tenant directory is
# "fake" because auth_enabled=false. Alerts route to the SAME Alertmanager
# receivers as Prometheus alerts (severity labels drive routing).
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true

limits_config:
  retention_period: 336h
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_query_series: 5000
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  allow_structured_metadata: true

analytics:
  reporting_enabled: false
